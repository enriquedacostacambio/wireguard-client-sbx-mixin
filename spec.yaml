# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: WireGuard client mixin

args:
  wireguard_go_version:
    default: "0.0.20250522"
    buildArg: WIREGUARD_GO_VERSION
  wireguard_tools_version:
    default: "v1.0.20260223"
    buildArg: WIREGUARD_TOOLS_VERSION
  openresolv_version:
    default: "v3.17.4"
    buildArg: OPENRESOLV_VERSION
  alpine_version:
    default: "3.24.3"
    buildArg: ALPINE_VERSION
  golang_version:
    default: "1.27.3-alpine3.24"
    buildArg: GOLANG_VERSION
  wireguard_client_config:
    required: true
  vpn_server:
    required: true


provides: ["wireguard-go@${{ kit.args.wireguard_go_version }}"]

capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: /usr/bin/wireguard-client-setup.sh "${{ kit.args.wireguard_client_config}}"
  - type: com.docker.sandbox/network-policy@2
    config:
      install:
        allow:
          - ${{ kit.args.vpn_server}}
